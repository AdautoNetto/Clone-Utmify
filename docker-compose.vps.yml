# ─────────────────────────────────────────────────────────────────────────────
# Log Pose — produção em VPS própria (Coolify ou Docker puro)
#
# O que NUNCA se perde em atualização (git push / redeploy):
#   • banco de dados  → volume "logpose_pgdata"   (o container do Postgres é
#                        recriado, os arquivos do banco ficam no volume)
#   • backups diários → pasta do servidor ${BACKUP_DIR:-/opt/logpose/backups}
# O container "app" não guarda nada em disco: pode ser recriado à vontade.
#
# Variáveis obrigatórias (Coolify: aba Environment Variables · Docker puro: .env):
#   DB_PASSWORD  só letras e números (vai dentro de uma URL), 32+ caracteres
#   SECRET_KEY   64 caracteres aleatórios (assina os logins)
# Gere no servidor:  openssl rand -hex 32
#
# Uso: ver deploy/LEIA-ME.md
# ─────────────────────────────────────────────────────────────────────────────
name: logpose

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://logpose:${DB_PASSWORD:?defina DB_PASSWORD}@db:5432/logpose
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Coolify: o domínio é ligado na interface (porta 8000). Docker puro: ver docker-compose.caddy.yml
    expose:
      - "8000"
    stop_grace_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logpose
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: logpose
      TZ: America/Sao_Paulo
    volumes:
      - logpose_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpose -d logpose"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tempo para o Postgres fechar os arquivos com segurança ao parar/atualizar
    stop_grace_period: 60s
    restart: unless-stopped
    # Sem "ports": o banco não fica exposto na internet, só o app enxerga

  backup:
    build:
      context: ./deploy/backup
    environment:
      PGHOST: db
      PGUSER: logpose
      PGPASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      PGDATABASE: logpose
      TZ: America/Sao_Paulo
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-/opt/logpose/backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  logpose_pgdata:
    # Nome fixo: mudar o nome do projeto/pasta não cria um banco novo e vazio
    name: logpose_pgdata
